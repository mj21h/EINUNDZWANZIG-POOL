name: Build Offline Standalone APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE22: 'true'

jobs:
  build-apk:
    name: Build Capacitor Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Node.js Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Generate Capacitor Project
        run: |
          npx cap add android
          npx cap copy android
          
      - name: Generate App Icons and Splash
        run: |
          mkdir -p assets
          cp public/bitcoin-logo-512.png assets/icon.png
          cp public/bitcoin-logo-512.png assets/icon-dark.png
          cp public/bitcoin-logo-512.png assets/splash.png
          cp public/bitcoin-logo-512.png assets/splash-dark.png
          npx capacitor-assets generate --android --iconBackgroundColor '#0b0c0e' --iconBackgroundColorDark '#0b0c0e' --splashBackgroundColor '#0b0c0e' --splashBackgroundColorDark '#0b0c0e'
          
      - name: Patch AndroidManifest for Notifications
        run: |
          sed -i '/<uses-permission android:name="android.permission.INTERNET" \/>/a \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" \/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" \/>' android/app/src/main/AndroidManifest.xml

      - name: Check Signing Secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Signing secrets missing::Missing GitHub Actions secrets:$missing. Release builds must be signed with the fixed release keystore. Add the secrets under Settings > Secrets and variables > Actions (see docs/release-signing.md)."
            exit 1
          fi

      - name: Restore Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keystore="$RUNNER_TEMP/release.keystore"
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"; then
            echo "::error title=Invalid keystore::ANDROID_KEYSTORE_BASE64 is not valid base64."
            exit 1
          fi
          if ! keytool -list -keystore "$keystore" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error title=Invalid keystore::Keystore could not be opened with ANDROID_KEYSTORE_PASSWORD or does not contain alias ANDROID_KEY_ALIAS."
            exit 1
          fi
          echo "ANDROID_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Configure Gradle Signing
        run: |
          cat <<'EOF' >> android/app/build.gradle

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_FILE"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build and Sign APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Build and Sign AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Standalone-Android-APK
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload AAB (Android App Bundle) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Standalone-Android-AAB
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Remove Release Keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
