name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  # Supress Node.js 20 deprecation warnings by forcing Node.js 24 execution on modern runners
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Job 1: Build PWA Static Assets (Vite)
  build-pwa:
    name: Build PWA Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js v24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build PWA Bundle
        run: npm run build

      - name: Upload Static Assets
        uses: actions/upload-artifact@v4
        with:
          name: pwa-dist-assets
          path: dist/

  # Job 2: Local Offline Bubblewrap Compilation (Compiles directly on the GitHub runner)
  local-bubblewrap-compiler:
    name: Build Signed Android APK
    needs: build-pwa
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Create local twa-manifest.json
        run: |
          cat << 'EOF' > twa-manifest.json
          {
            "packageId": "de.einundzwanzig.pool",
            "host": "einundzwanzig-pool.de",
            "name": "EINUNDZWANZIG POOL",
            "launcherName": "EINUNDZWANZIG POOL",
            "displayMode": "standalone",
            "themeColor": "#111827",
            "navigationColor": "#111827",
            "backgroundColor": "#111827",
            "enableNotifications": true,
            "startUrl": "/",
            "iconUrl": "https://einundzwanzig-pool.de/bitcoin-logo-512.png",
            "maskableIconUrl": "https://einundzwanzig-pool.de/bitcoin-logo-512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "android-key"
            },
            "appVersionCode": 1,
            "appVersion": "1.0.0",
            "fallbackType": "customtabs",
            "features": {},
            "alphaHeaders": []
          }
          EOF

      - name: Generate Signing Keystore
        run: |
          keytool -genkey -v \
            -keystore android.keystore \
            -alias android-key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass password123 \
            -keypass password123 \
            -dname "CN=Android,O=Android,C=US"

      - name: Configure Bubblewrap Paths
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_SDK_ROOT\"}" > ~/.bubblewrap/config.json

      - name: Initialize and Validate Bubblewrap Project
        run: |
          mkdir -p ./android-project
          cp android.keystore ./android-project/android.keystore
          yes "" | bubblewrap init --manifest=twa-manifest.json --directory=./android-project --skipValidation

      - name: Build Signed Android APK & AAB
        working-directory: ./android-project
        run: |
          yes "" | bubblewrap build --signingKeyPath=./android.keystore --signingKeyPassword=password123 --signingKeyAlias=android-key --signingKeyAliasPassword=password123

      - name: Upload Locally Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-local-bubblewrap
          path: ./android-project/app-release-signed.apk

