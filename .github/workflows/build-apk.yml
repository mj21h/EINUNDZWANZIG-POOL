name: Build Offline Standalone APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE22: 'true'

jobs:
  build-apk:
    name: Build Capacitor Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Node.js Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Generate Capacitor Project
        run: |
          npx cap add android
          npx cap copy android
          
      - name: Generate App Icons and Splash
        run: |
          mkdir -p assets
          cp public/bitcoin-logo-512.png assets/icon.png
          cp public/bitcoin-logo-512.png assets/icon-dark.png
          cp public/bitcoin-logo-512.png assets/splash.png
          cp public/bitcoin-logo-512.png assets/splash-dark.png
          npx capacitor-assets generate --android --iconBackgroundColor '#0b0c0e' --iconBackgroundColorDark '#0b0c0e' --splashBackgroundColor '#0b0c0e' --splashBackgroundColorDark '#0b0c0e'
          
      - name: Patch AndroidManifest for Notifications
        run: |
          sed -i '/<uses-permission android:name="android.permission.INTERNET" \/>/a \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" \/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" \/>' android/app/src/main/AndroidManifest.xml

      - name: Generate Custom Keystore for Signing
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "cn=Einundzwanzig, ou=Pool, o=Einundzwanzig, c=DE"
          cp debug.keystore android/app/debug.keystore

      - name: Configure Gradle Signing
        run: |
          cat <<EOF >> android/app/build.gradle
          
          android {
              signingConfigs {
                  release {
                      storeFile file("debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build and Sign APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Build and Sign AAB
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Standalone-Android-APK
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload AAB (Android App Bundle) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Standalone-Android-AAB
          path: android/app/build/outputs/bundle/release/*.aab

