name: Build Offline Standalone APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE22: 'true'

jobs:
  build-apk:
    name: Build Capacitor Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Node.js Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Generate Capacitor Project
        run: |
          npx cap add android
          npx cap copy android
          
      - name: Generate App Icons and Splash
        run: |
          mkdir -p assets
          cp public/bitcoin-logo-512.png assets/icon.png
          cp public/bitcoin-logo-512.png assets/icon-dark.png
          cp public/bitcoin-logo-512.png assets/splash.png
          cp public/bitcoin-logo-512.png assets/splash-dark.png
          npx capacitor-assets generate --android --iconBackgroundColor '#0b0c0e' --iconBackgroundColorDark '#0b0c0e' --splashBackgroundColor '#0b0c0e' --splashBackgroundColorDark '#0b0c0e'
          
      - name: Prepare Signing Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            # Persistent keystore from repository secrets: every build carries the same
            # signature, so new APKs install as updates over older ones.
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            {
              echo "SIGNING_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
              echo "SIGNING_KEY_ALIAS=$ANDROID_KEY_ALIAS"
              echo "SIGNING_KEY_PASSWORD=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            } >> "$GITHUB_ENV"
          else
            echo "::warning title=Temporary signing key::Secret ANDROID_KEYSTORE_BASE64 is not set. This APK is signed with a throwaway key and cannot be installed as an update over a previous build."
            keytool -genkeypair -v \
              -keystore android/app/release.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "cn=Einundzwanzig, ou=Pool, o=Einundzwanzig, c=DE"
            {
              echo "SIGNING_STORE_PASSWORD=android"
              echo "SIGNING_KEY_ALIAS=androiddebugkey"
              echo "SIGNING_KEY_PASSWORD=android"
            } >> "$GITHUB_ENV"
          fi

      - name: Configure Gradle Signing
        run: |
          cat <<'EOF' >> android/app/build.gradle

          android {
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword System.getenv("SIGNING_STORE_PASSWORD")
                      keyAlias System.getenv("SIGNING_KEY_ALIAS")
                      keyPassword System.getenv("SIGNING_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build and Sign APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Build and Sign AAB
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Standalone-Android-APK
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload AAB (Android App Bundle) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Standalone-Android-AAB
          path: android/app/build/outputs/bundle/release/*.aab

