name: Build PWA Signed APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-apk:
    name: Build Signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Node.js Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Generate Custom Keystore for Signing
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "cn=Einundzwanzig, ou=Pool, o=Einundzwanzig, c=DE"

      - name: Prepare Bubblewrap CLI Configuration
        run: |
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "/usr/local/lib/android/sdk"
          }
          EOF
          echo "Bubblewrap paths configured."

      - name: Start Local Web Server
        run: |
          node serve-dist.cjs &
          echo "Waiting for local web server to start..."
          sleep 3

      - name: Patch twa-manifest.json for Local Build
        run: |
          # Redirect twa-manifest targets to our local web server to ensure offline-compatible non-interactive build
          sed -i 's|https://ais-pre-evuc3pra63felfjkdeui6f-168332579315.europe-west2.run.app/manifest.json|http://localhost:12345/manifest.json|g' twa-manifest.json
          sed -i 's|https://ais-pre-evuc3pra63felfjkdeui6f-168332579315.europe-west2.run.app/bitcoin-logo-512.png|http://localhost:12345/bitcoin-logo-512.png|g' twa-manifest.json
          echo "twa-manifest.json patched successfully."

      - name: Run Bubblewrap Build
        run: |
          # Generate Android project files directly from the patched twa-manifest
          npx @bubblewrap/cli update --skipVersionUpgrade
          
      - name: Build and Sign APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -r | head -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found!"
            exit 1
          fi
          $APKSIGNER sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out app-release-signed.apk app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Build and Sign AAB
        run: |
          ./gradlew bundleRelease
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore debug.keystore -storepass android -keypass android app/build/outputs/bundle/release/app-release.aab androiddebugkey

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Signed-Android-APK
          path: ./*.apk

      - name: Upload AAB (Android App Bundle) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Signed-Android-AAB
          path: app/build/outputs/bundle/release/app-release.aab
