name: Build PWA Signed APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-apk:
    name: Build Signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Node.js Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Generate Custom Keystore for Signing
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "cn=Einundzwanzig, ou=Pool, o=Einundzwanzig, c=DE"

      - name: Prepare Bubblewrap CLI Configuration
        run: |
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF
          echo "Bubblewrap paths configured."

      - name: Run Bubblewrap Build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: android
          BUBBLEWRAP_KEY_PASSWORD: android
        run: |
          npx @bubblewrap/cli init --twaManifest=twa-manifest.json --yes
          npx @bubblewrap/cli build --yes

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Signed-Android-APK
          path: ./*.apk

      - name: Upload AAB (Android App Bundle) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Signed-Android-AAB
          path: ./*.aab
