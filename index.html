<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Einundzwanzig Pool</title>
    
    <!-- App Icon Config -->
    <link rel="icon" type="image/svg+xml" href="/bitcoin-logo.svg" />
    <link rel="apple-touch-icon" href="/bitcoin-logo-512.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#151515" />
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const isNativeApp = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
          if (isNativeApp) {
            // The Android app serves its files locally; remove workers left over from older versions.
            navigator.serviceWorker.getRegistrations()
              .then(regs => regs.forEach(reg => reg.unregister()))
              .catch(() => {});
            return;
          }
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SW Registered', reg))
            .catch(err => console.error('SW Registration Failed', err));
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
